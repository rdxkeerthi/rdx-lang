name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Assets (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -std=c11 -O3 -mconsole -static -s -o rdx.exe src/main.c src/rdx_engine.c src/rdx_cyber.c src/rdx_diag.c -lm
          Compress-Archive -Path rdx.exe, install.bat, install.ps1, uninstall.bat, README.md, INSTALLATION.md, PROGRAMS.md, FEATURES.md, LICENSE, examples -DestinationPath rdx-windows-x64.zip
          mkdir win_dist
          Copy-Item rdx.exe win_dist/
          Copy-Item install.bat win_dist/
          Copy-Item install.ps1 win_dist/
          Copy-Item uninstall.bat win_dist/
          Copy-Item rdx-windows-x64.zip win_dist/

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: win_dist/*

      - name: Build Assets (Linux)
        if: runner.os == 'Linux'
        run: |
          make
          strip rdx
          tar -czvf rdx-linux-x64.tar.gz rdx Makefile README.md INSTALLATION.md PROGRAMS.md FEATURES.md LICENSE examples/
          mkdir linux_dist
          cp rdx linux_dist/
          cp rdx-linux-x64.tar.gz linux_dist/

      - name: Upload Linux Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: linux_dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
