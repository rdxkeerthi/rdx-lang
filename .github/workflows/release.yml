name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Asset (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: rdx-windows-x64.zip
            binary: rdx.exe
          - os: ubuntu-latest
            artifact_name: rdx-linux-x64.tar.gz
            binary: rdx

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc -std=c11 -O2 -mconsole -static -s -o rdx.exe src/main.c src/rdx_engine.c src/rdx_cyber.c src/rdx_diag.c
          Compress-Archive -Path rdx.exe, README.md, LICENSE, examples -DestinationPath ${{ matrix.artifact_name }}

      - name: Build Binary (Linux)
        if: runner.os == 'Linux'
        run: |
          make
          strip rdx
          tar -czvf ${{ matrix.artifact_name }} rdx README.md LICENSE examples/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} . \;
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
